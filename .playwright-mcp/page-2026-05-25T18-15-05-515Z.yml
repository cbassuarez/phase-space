          - paragraph [ref=e33]: A strange-attractor sandbox and visual instrument for looking at chaotic systems as moving geometry.
          - paragraph [ref=e34]: "It sits between a sketchbook, a renderer, and a small cybernetic instrument: pick a system, let the equations move, then use camera motion, light, and sound to find the shape inside the motion."
