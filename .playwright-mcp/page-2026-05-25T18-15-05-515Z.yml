              - paragraph [ref=e78]: A spiral that keeps peeling into a folded sheet. It reads like a slow mechanical orbit until the surface turns over and exposes how much motion is hidden in the loop.
          - article [ref=e79]:
            - img "Aizawa attractor render" [ref=e80]
