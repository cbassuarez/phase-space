              - paragraph [ref=e99]: "A dual-scroll system born from an electronic circuit. It matters because its chaos can be soldered together: a physical system with a clean visual snap between two scrolls."
      - generic [ref=e101]:
        - paragraph [ref=e102]: Sebastian
        - generic [ref=e103]:
          - paragraph [ref=e104]: Sebastian Suarez-Solis is a cybernetic artist, public systems artist, and creative technologist.
          - paragraph [ref=e105]: "His work is interested in feedback, infrastructure, signal, and the point where a tool starts acting like an environment. Phase Space is one small expression of that: a browser instrument where equations, rendering, and input routing become something you can steer."
      - generic [ref=e107]:
        - paragraph [ref=e108]: More info
        - generic [ref=e109]:
          - generic [ref=e110]:
            - paragraph [ref=e111]: Internally, Phase Space is split into a Rust core, a WebAssembly bridge, and a React/WebGL viewer. A scene model carries the chosen system, parameters, seeds, view settings, and camera behavior.
            - paragraph [ref=e112]: The goal is not to turn the About page into documentation. It is enough to know that the visuals are generated from the same structured engine the viewer uses.
