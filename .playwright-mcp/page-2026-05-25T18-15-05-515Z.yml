      - generic [ref=e45]:
        - paragraph [ref=e46]: Why this exists
        - generic [ref=e47]:
          - paragraph [ref=e48]: "I built Phase Space because strange attractors are usually treated as either textbook diagrams or screen-saver decoration. I wanted something in between: a working instrument where the math stays intact, but the experience is visual, tactile, and a little unstable."
          - paragraph [ref=e49]: The project is also a way to study public systems in miniature. A few equations, a feedback loop, a camera, and an input signal can produce behavior that feels alive without pretending to be alive.
      - generic [ref=e51]:
        - paragraph [ref=e52]: What it does
        - generic [ref=e53]:
          - generic [ref=e54]: Integrates strange attractors in Rust and runs them in the browser through WebAssembly.
          - generic [ref=e55]: Turns trajectories into WebGL scenes with line, ribbon, photon-weave, caustic, and cloud render modes.
          - generic [ref=e56]: "Treats the camera as part of the instrument: orbit, chase, lobe, and survey motion change how each system is understood."
          - generic [ref=e57]: Lets audio input and output modulate the image without turning the panel into a wall of knobs.
      - generic [ref=e58]:
        - generic [ref=e59]:
          - generic [ref=e60]:
            - paragraph [ref=e61]: Systems
            - heading "Five ways chaos becomes visible" [level=2] [ref=e62]
          - paragraph [ref=e63]: Each image is a local WebP render generated from the system equations, not a screenshot of the old pages.
