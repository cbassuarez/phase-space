name: Release

# Builds the phase-space desktop app and attaches the bundles to the GitHub
# release. A version tag (v*) builds all three OSes. workflow_dispatch can target
# one platform (e.g. only=macos) to fill in a missing build without rebuilding
# the others' assets.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.1.1)'
        required: true
      only:
        description: 'Platforms to build'
        type: choice
        options: [all, macos, windows, linux]
        default: all

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          case "${{ github.event.inputs.only }}" in
            macos)   M='{"include":[{"os":"macos-14"}]}' ;;
            windows) M='{"include":[{"os":"windows-latest"}]}' ;;
            linux)   M='{"include":[{"os":"ubuntu-22.04"}]}' ;;
            *)       M='{"include":[{"os":"macos-14"},{"os":"ubuntu-22.04"},{"os":"windows-latest"}]}' ;;
          esac
          echo "matrix=$M" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install desktop (root) dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Configure macOS signing
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          append_env() {
            local name="$1" value="$2"
            if [[ -n "$value" ]]; then
              {
                echo "$name<<__${name}__"
                echo "$value"
                echo "__${name}__"
              } >> "$GITHUB_ENV"
            fi
          }

          if [[ -n "$APPLE_CERTIFICATE_SECRET" ]]; then
            if [[ -z "$APPLE_CERTIFICATE_PASSWORD_SECRET" || -z "$APPLE_SIGNING_IDENTITY_SECRET" ]]; then
              echo "::error::Set APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY with APPLE_CERTIFICATE."
              exit 1
            fi
            append_env APPLE_CERTIFICATE "$APPLE_CERTIFICATE_SECRET"
            append_env APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD_SECRET"
            append_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY_SECRET"
            # Notarization (optional): set APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID.
            append_env APPLE_ID "$APPLE_ID_SECRET"
            append_env APPLE_PASSWORD "$APPLE_PASSWORD_SECRET"
            append_env APPLE_TEAM_ID "$APPLE_TEAM_ID_SECRET"
          else
            append_env APPLE_SIGNING_IDENTITY "-"
            echo "::warning::APPLE_CERTIFICATE is not configured; macOS release will be ad-hoc signed and require Open Anyway on first launch."
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: phase-space ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Prebuilt **phase-space desktop** builds — macOS, Windows, Linux.

            Free and open source. Same viewer as the web app, in a native window.

            > macOS builds are notarized when the repository's Apple Developer signing secrets are configured. Without those secrets they are ad-hoc signed only, so Gatekeeper may require System Settings → Privacy & Security → Open Anyway on first launch.
          releaseDraft: false
          prerelease: false
