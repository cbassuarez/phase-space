[package]
name = "phase-space-desktop"
version = "1.2.0"
edition = "2021"
description = "phase-space — interactive attractor / phase-space viewer"

[lib]
name = "phase_space_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
phasecore = { path = "../phasecore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
