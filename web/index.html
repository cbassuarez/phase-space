<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>phase-space viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Favicon / tab icon -->
    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%phase-space-icon.png"
    />

    <!-- Apple / iOS home-screen icons -->
    <link
      rel="apple-touch-icon"
      sizes="29x29"
      href="%BASE_URL%phase-space-icon-29.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="76x76"
      href="%BASE_URL%phase-space-icon-76.png"
    />
    <link
      rel="apple-touch-icon"
      href="%BASE_URL%phase-space-icon.png"
    />

    <!-- Web app manifest (for Android / PWA-style install) -->
    <link
      rel="manifest"
      href="%BASE_URL%site.webmanifest"
    />

    <!-- Optional but recommended for theming on mobile -->
    <meta name="theme-color" content="#050814" />
  </head>
  <body class="bg-[color:var(--ps-bg)]">
    <div id="root"></div>
    <!-- Apply the saved theme before paint to avoid a light flash for dim users. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ps-theme");
          var theme = t === "dim" || t === "light" ? t : "light";
          document.documentElement.classList.toggle("dark", theme === "dim");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
